<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 100px;
        }
        textarea {
            width: 60%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            color: #333;
        }
        .result {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Email / Message Spam Detection</h2>
        <form action="/predict" method="post">
            <textarea name="message" placeholder="Enter your message here..." required></textarea><br>
            <button type="submit">Check</button>
        </form>

        {% if prediction %}
        <div class="result">
            <strong>Result:</strong> {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
